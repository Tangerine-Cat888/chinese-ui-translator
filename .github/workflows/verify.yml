name: Verify release
on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm audit
      - run: npm ls --all
      - run: npm run build
      - run: npm run package
      - run: sha256sum -c release.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chinese-ui-translator-${{ github.sha }}
          path: dist/
          if-no-files-found: error
