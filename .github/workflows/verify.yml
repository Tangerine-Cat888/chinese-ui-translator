name: Verify release
on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run audit:release
      - run: npm ls --all
      - run: npm run build
      - run: npm run package
      - run: sha256sum -c release.sha256
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-checksums: release.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chinese-ui-translator-${{ github.sha }}
          path: dist/
          if-no-files-found: error
